[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
ignore = []

[project]
name = "rossmann"
version = "0.1.0"
description = "Rossmann Store Sales Forecasting"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi[standard]==0.141.1",
    "uvicorn==0.52.1",
    "gradio==6.21.0",
    "mlflow==3.14.0",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "lightgbm==4.6.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "joblib==1.5.3",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[dependency-groups]
training = [
    "optuna>=4.9.0",
    "shap>=0.47.0",
    "numba>=0.59.0",
    "statsmodels>=0.14.6",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]

dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "docker>=7.1.0",
    "ruff>=0.16.1",
    "ipykernel>=7.3.0",
]
