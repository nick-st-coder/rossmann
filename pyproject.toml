[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
ignore = []

[project]
name = "rossmann"
version = "0.1.0"
description = "Dependecies for project: rossmann"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core application
    "fastapi[standard]==0.141.1",
    "uvicorn==0.52.1",
    "gradio==6.21.0",
    # ML inference
    "mlflow==3.14.0",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "xgboost==3.3.0",
    "lightgbm==4.6.0",
    # Utilities
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "joblib==1.5.3",
]

[dependency-groups]
training = [
    "auto-mix-prep>=0.2.0",
    "optuna>=4.9.0",
    "shap>=0.47.0",
    "numba>=0.59.0",
    "great-expectations>=1.18.2",
    "statsmodels>=0.14.6",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]

aws = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]

dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "pandas-stubs>=2.2.0.20241218",
    "docker>=7.1.0",
    "ruff>=0.16.1",
]
